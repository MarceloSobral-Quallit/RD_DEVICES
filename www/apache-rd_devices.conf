# Apache 2.4 - exemplo de publicacao do RD Devices WWW
#
# Copiar para:
#   /etc/apache2/sites-available/rd_devices.conf
#
# Ativar:
#   sudo a2ensite rd_devices.conf
#   sudo apachectl configtest
#   sudo systemctl reload apache2

Alias /rd_devices /var/www/rd_devices

<Directory /var/www/rd_devices>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    <FilesMatch "^config\.web\.php$">
        Require all denied
    </FilesMatch>
</Directory>

# Configuracao sensivel fora do DocumentRoot.
# Os PHPs da aplicacao devem carregar este arquivo quando existir:
#   /etc/rd_devices/config.web.php
<Directory /etc/rd_devices>
    Require all denied
</Directory>

# Cabecalhos basicos de seguranca. Ajustar CSP quando assets finais existirem.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</IfModule>

